services:
  app:
    platform: linux/amd64
    image: ${IMAGE_URI:-crawlix:latest}
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - database_url
    container_name: crawlix
    command: ["node", "dist/server.js"]
    ports:
      - "127.0.0.1:${PORT:-8001}:8001"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8001}
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:8001/health'', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

secrets:
  database_url:
    environment: DATABASE_URL
