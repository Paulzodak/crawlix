services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm run prisma:generate && npm run dev"
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
